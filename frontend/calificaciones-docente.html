<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Capturar Calificaciones</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>
<div class="navbar">
  <div class="navbar-left">
    <button class="navbar-back" onclick="history.back()">&#8592;</button>
    <h2 id="navbar-titulo">Capturar Calificaciones</h2>
    <span id="navbar-rol" class="rol-badge"></span>
  </div>
  <div class="navbar-right">
    <span class="user-info" id="navbar-usuario"></span>
    <button onclick="logout()">Cerrar sesion</button>
  </div>
</div>
<div class="container">
  <div class="card" style="margin-bottom:20px;">
    <div class="form-row">
      <div class="form-field form-field-md">
        <label>Materia / Grupo</label>
        <select id="sel-materia-grupo"><option value="">Seleccionar...</option></select>
      </div>
      <div class="form-field form-field-sm">
        <label>Periodo</label>
        <input id="inp-periodo" value="2026-1">
      </div>
      <div class="form-field" style="justify-content:flex-end;">
        <button class="btn-primary" onclick="cargarAlumnos()">Cargar Alumnos</button>
      </div>
    </div>
  </div>
  <div class="card">
    <h3 id="titulo-tabla">Alumnos</h3>
    <table class="tabla">
      <thead><tr><th>Matricula</th><th>Alumno</th><th>Parcial 1</th><th>Parcial 2</th><th>Parcial 3</th><th>Promedio</th><th>Estado</th><th>Guardar</th></tr></thead>
      <tbody id="tbody-calificaciones"><tr><td colspan="8" style="text-align:center;color:var(--text-sub);">Selecciona una materia y carga los alumnos.</td></tr></tbody>
    </table>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/calificaciones-docente.js"></script>
<script>
  window.onload=async()=>{
    const sesion=checkSesion();
    if(!sesion||sesion.rol!=='docente'){window.location.href='login.html';return;}
    renderNavbar('Capturar Calificaciones');
    await cargarMisMateriasGrupo(sesion.id);
  };
</script>
</body>
</html>
