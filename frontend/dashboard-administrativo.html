<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Administrativo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="navbar">
  <div class="navbar-left">
    <h2 id="navbar-titulo">Panel Administrativo</h2>
    <span id="navbar-rol" class="rol-badge"></span>
  </div>
  <div class="navbar-right">
    <span class="user-info" id="navbar-usuario"></span>
    <a href="cambiar-nip.html" style="color:white; font-size:13px; text-decoration:none; opacity:0.9;">🔑 Cambiar NIP</a>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="container">
  <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:16px; margin-bottom:24px;">

    <div style="background:white;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-top:4px solid #1a73e8;">
      <div style="font-size:28px;margin-bottom:8px;">👨‍🎓</div>
      <div style="font-weight:600;color:#333;margin-bottom:6px;">Alumnos</div>
      <a href="gestion-alumnos.html" style="text-decoration:none;color:#1a73e8;font-size:13px;">Gestionar →</a>
    </div>

    <div style="background:white;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-top:4px solid #1a73e8;">
      <div style="font-size:28px;margin-bottom:8px;">👨‍🏫</div>
      <div style="font-weight:600;color:#333;margin-bottom:6px;">Docentes</div>
      <a href="gestion-docentes.html" style="text-decoration:none;color:#1a73e8;font-size:13px;">Gestionar →</a>
    </div>

    <div style="background:white;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-top:4px solid #1a73e8;">
      <div style="font-size:28px;margin-bottom:8px;">📚</div>
      <div style="font-weight:600;color:#333;margin-bottom:6px;">Materias</div>
      <a href="gestion-materias.html" style="text-decoration:none;color:#1a73e8;font-size:13px;">Gestionar →</a>
    </div>

    <div style="background:white;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-top:4px solid #1a73e8;">
      <div style="font-size:28px;margin-bottom:8px;">🏫</div>
      <div style="font-weight:600;color:#333;margin-bottom:6px;">Aulas</div>
      <a href="gestion-aulas.html" style="text-decoration:none;color:#1a73e8;font-size:13px;">Gestionar →</a>
    </div>

    <div style="background:white;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-top:4px solid #1a73e8;">
      <div style="font-size:28px;margin-bottom:8px;">🎓</div>
      <div style="font-weight:600;color:#333;margin-bottom:6px;">Carreras</div>
      <a href="gestion-carreras.html" style="text-decoration:none;color:#1a73e8;font-size:13px;">Gestionar →</a>
    </div>

    <div style="background:white;border-radius:10px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-top:4px solid #e53935;">
      <div style="font-size:28px;margin-bottom:8px;">📋</div>
      <div style="font-weight:600;color:#333;margin-bottom:6px;">Inscripciones</div>
      <a href="gestion-inscripciones.html" style="text-decoration:none;color:#e53935;font-size:13px;">Gestionar →</a>
    </div>

  </div>
</div>

<script src="js/dashboard.js"></script>
<script>
  const sesion = checkSesion();
  if (sesion && sesion.rol !== 'admin') window.location.href = 'login.html';
  renderNavbar('Panel Administrativo', sesion?.rol);
</script>
</body>
</html>
