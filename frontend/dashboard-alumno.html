<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Alumno</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>
<div class="navbar">
  <div class="navbar-left">
    <h2 id="navbar-titulo">Portal Alumno</h2>
    <span id="navbar-rol" class="rol-badge"></span>
  </div>
  <div class="navbar-right">
    <span class="user-info" id="navbar-usuario"></span>
    <a href="mis-calificaciones.html" class="navbar-link">Mis Calificaciones</a>
    <a href="cambiar-nip.html" class="navbar-link">Cambiar NIP</a>
    <button onclick="logout()">Cerrar sesion</button>
  </div>
</div>
<div class="container">
  <div class="tabs no-print">
    <button class="tab-btn active" onclick="mostrarTab('materias',event)">Mis Materias</button>
    <button class="tab-btn"        onclick="mostrarTab('horario',event)">Horario</button>
    <button class="tab-btn"        onclick="mostrarTab('boleta',event)">Boleta</button>
  </div>
  <div class="tab-content active" id="tab-materias">
    <div class="card">
      <h3>Mis materias inscritas</h3>
      <table class="tabla">
        <thead><tr><th>Clave</th><th>Materia</th><th>Creditos</th><th>Docente</th><th>Grupo</th><th>Turno</th></tr></thead>
        <tbody id="tbody-materias"><tr><td colspan="6">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="tab-content" id="tab-horario">
    <div class="card">
      <h3>Mi horario semanal</h3>
      <div id="horario-contenido" style="margin-top:16px;"><p style="color:var(--text-sub);font-size:13px;">Cargando horario...</p></div>
      <div style="margin-top:16px;" class="no-print">
        <button class="btn-secondary" onclick="window.print()">Imprimir horario</button>
      </div>
    </div>
  </div>
  <div class="tab-content" id="tab-boleta">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
        <div>
          <h3 style="margin-bottom:4px;">Boleta de calificaciones</h3>
          <p id="boleta-info" style="color:var(--text-sub);font-size:12px;"></p>
        </div>
        <button class="btn-secondary no-print" onclick="window.print()">Imprimir boleta</button>
      </div>
      <table class="tabla">
        <thead><tr><th>Clave</th><th>Materia</th><th>Creditos</th><th>Parcial 1</th><th>Parcial 2</th><th>Parcial 3</th><th>Promedio</th><th>Docente</th></tr></thead>
        <tbody id="tbody-boleta"><tr><td colspan="8">Cargando...</td></tr></tbody>
      </table>
      <div id="promedio-general" style="margin-top:16px;text-align:right;font-size:14px;font-weight:700;color:var(--blue);"></div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script>
  const DIAS=['lunes','martes','miercoles','jueves','viernes'];
  const DIAS_LABEL={lunes:'Lunes',martes:'Martes',miercoles:'Miercoles',jueves:'Jueves',viernes:'Viernes'};
  const HORAS=['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'];
  let sesionGlobal=null;
  window.onload=async()=>{
    const sesion=checkSesion();
    if(!sesion||sesion.rol!=='alumno'){window.location.href='login.html';return;}
    sesionGlobal=sesion; renderNavbar('Portal Alumno'); await cargarMaterias();
  };
  function mostrarTab(tab,e){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active'); e.target.classList.add('active');
    if(tab==='horario')cargarHorario(); if(tab==='boleta')cargarBoleta();
  }
  async function cargarMaterias(){
    const tbody=document.getElementById('tbody-materias');
    try{
      const materias=await apiGetMisMateriasAlumno(sesionGlobal.id); tbody.innerHTML='';
      if(!materias.length){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text-sub);">No tienes materias asignadas aun.</td></tr>';return;}
      materias.forEach(m=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${m.clave}</td><td>${m.nombre}</td><td>${m.creditos}</td><td>${m.docente_nombre?m.docente_nombre+' '+m.docente_apellidos:'—'}</td><td>${m.grupo}</td><td>${m.turno}</td>`;tbody.appendChild(tr);});
    }catch{tbody.innerHTML='<tr><td colspan="6">Error al cargar materias</td></tr>';}
  }
  async function cargarHorario(){
    const contenedor=document.getElementById('horario-contenido');
    try{
      const horario=await apiGetHorarioAlumno(sesionGlobal.id);
      if(!horario.length||horario.every(h=>!h.dia_semana)){contenedor.innerHTML='<p style="color:var(--text-sub);font-size:13px;">El horario aun no ha sido configurado.</p>';return;}
      let html='<div class="horario-grid"><div class="horario-header">Hora</div>';
      DIAS.forEach(d=>html+=`<div class="horario-header">${DIAS_LABEL[d]}</div>`);
      HORAS.forEach(hora=>{
        html+=`<div class="horario-hora">${hora}</div>`;
        DIAS.forEach(dia=>{
          const clase=horario.find(h=>h.dia_semana===dia&&h.hora_inicio&&h.hora_inicio.slice(0,5)===hora);
          html+=clase?`<div class="horario-celda ocupado"><div class="materia-nombre">${clase.materia}</div><div class="materia-info">${clase.docente_nombre?clase.docente_nombre+' '+clase.docente_apellidos:''}</div><div class="materia-info">${clase.hora_inicio?clase.hora_inicio.slice(0,5):''} - ${clase.hora_fin?clase.hora_fin.slice(0,5):''}</div></div>`:'<div class="horario-celda"></div>';
        });
      });
      contenedor.innerHTML=html+'</div>';
    }catch{contenedor.innerHTML='<p style="color:var(--danger);">Error al cargar horario.</p>';}
  }
  async function cargarBoleta(){
    const tbody=document.getElementById('tbody-boleta'),promGeneral=document.getElementById('promedio-general'),boletaInfo=document.getElementById('boleta-info');
    try{
      const boleta=await apiGetBoletaAlumno(sesionGlobal.id),user=JSON.parse(localStorage.getItem('user'));
      boletaInfo.textContent=`Alumno: ${user.nombre||user.usuario} — Periodo: 2025-1`;
      tbody.innerHTML='';
      if(!boleta.length){tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--text-sub);">Sin calificaciones registradas aun.</td></tr>';return;}
      let suma=0,cont=0;
      boleta.forEach(b=>{
        const prom=parseFloat(b.promedio);let chipClass='promedio-vacio',promTexto='—';
        if(!isNaN(prom)){chipClass=prom>=6?'promedio-aprobado':'promedio-reprobado';promTexto=prom.toFixed(2);suma+=prom;cont++;}
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${b.clave}</td><td>${b.materia}</td><td>${b.creditos}</td><td>${b.parcial1??'—'}</td><td>${b.parcial2??'—'}</td><td>${b.parcial3??'—'}</td><td><span class="promedio-chip ${chipClass}">${promTexto}</span></td><td>${b.docente_nombre?b.docente_nombre+' '+b.docente_apellidos:'—'}</td>`;
        tbody.appendChild(tr);
      });
      if(cont>0){const pg=(suma/cont).toFixed(2);promGeneral.innerHTML=`Promedio general: <span style="color:${parseFloat(pg)>=6?'#1A7A3F':'var(--danger)'};font-size:18px;">${pg}</span>`;}
    }catch{tbody.innerHTML='<tr><td colspan="8">Error al cargar boleta</td></tr>';}
  }
</script>
</body>
</html>
