<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Alumno</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>

<div class="navbar">
  <div class="navbar-left">
    <h2 id="navbar-titulo">Portal Alumno</h2>
    <span id="navbar-rol" class="rol-badge"></span>
  </div>
  <div class="navbar-right">
    <span class="user-info" id="navbar-usuario"></span>
    <a href="cambiar-nip.html" style="color:white; font-size:13px; text-decoration:none; opacity:0.9;">🔑 Cambiar NIP</a>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="container">
  <div style="margin-bottom:20px;">
    <a href="mis-calificaciones.html"
       style="display:inline-block; padding:10px 22px; background:#1a73e8; color:white;
              text-decoration:none; border-radius:8px; font-size:14px; font-weight:600;">
      📊 Ver Mis Calificaciones
    </a>
  </div>

  <div class="card">
    <h3>Mis materias inscritas</h3>
    <p style="color:#666; margin-bottom:16px; font-size:13px;">
      Materias asignadas a tu grupo este ciclo escolar.
    </p>
    <table class="tabla">
      <thead>
        <tr>
          <th>Clave</th><th>Materia</th><th>Créditos</th>
          <th>Docente</th><th>Grupo</th><th>Turno</th>
        </tr>
      </thead>
      <tbody id="tbody-materias">
        <tr><td colspan="6">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script>
  window.onload = async () => {
    const sesion = checkSesion();
    if (!sesion || sesion.rol !== 'alumno') { window.location.href = 'login.html'; return; }
    renderNavbar('Portal Alumno');
    const tbody = document.getElementById('tbody-materias');
    try {
      const materias = await apiGetMisMateriasAlumno(sesion.id);
      tbody.innerHTML = '';
      if (materias.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">No tienes materias asignadas aún.</td></tr>';
        return;
      }
      materias.forEach(m => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${m.clave}</td><td>${m.nombre}</td><td>${m.creditos}</td>
          <td>${m.docente_nombre ? m.docente_nombre + ' ' + m.docente_apellidos : '—'}</td>
          <td>${m.grupo}</td><td>${m.turno}</td>`;
        tbody.appendChild(tr);
      });
    } catch {
      tbody.innerHTML = '<tr><td colspan="6">Error al cargar materias</td></tr>';
    }
  };
</script>
</body>
</html>
