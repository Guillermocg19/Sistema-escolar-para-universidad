<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Docente</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
  <style>
    .tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid var(--border)}
    .tab-btn{padding:10px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font);color:var(--text-sub);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
    .tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
    .tab-content{display:none}.tab-content.active{display:block}
    .horario-grid{display:grid;grid-template-columns:72px repeat(5,1fr);gap:3px;font-size:12px;overflow-x:auto}
    .h-header{background:var(--blue);color:white;padding:8px;text-align:center;border-radius:6px;font-weight:700}
    .h-hora{background:var(--blue-light);color:var(--blue);padding:8px;text-align:center;border-radius:6px;font-weight:600;font-size:11px;display:flex;align-items:center;justify-content:center}
    .h-cell{padding:8px;border-radius:6px;border:1px solid var(--border);background:white;min-height:56px;font-size:11px}
    .h-cell.occ{background:var(--blue-light);border-color:#90caf9}
    .h-cell .mn{font-weight:700;color:var(--blue)}.h-cell .mi{color:#666;font-size:10px;margin-top:2px}
  </style>
</head>
<body>
<div class="navbar">
  <div class="navbar-left">
    <h2 id="navbar-titulo">Portal Docente</h2>
    <span id="navbar-rol" class="rol-badge"></span>
  </div>
  <div class="navbar-right">
    <span class="user-info" id="navbar-usuario"></span>
    <a href="cambiar-nip.html" style="color:white;font-size:13px;text-decoration:none;opacity:.9;">🔑 Cambiar NIP</a>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
</div>
<div class="container">
  <div style="margin-bottom:20px;">
    <a href="calificaciones-docente.html"
       style="display:inline-block;padding:10px 22px;background:var(--blue);color:white;text-decoration:none;border-radius:8px;font-size:14px;font-weight:600;">
      📝 Capturar Calificaciones
    </a>
  </div>
  <div class="tabs">
    <button class="tab-btn active" onclick="mostrarTab('materias',event)">📚 Mis Materias</button>
    <button class="tab-btn"        onclick="mostrarTab('horario',event)">🕐 Mi Horario</button>
  </div>
  <div class="tab-content active" id="tab-materias">
    <div class="card">
      <h3>Mis materias asignadas</h3>
      <p style="color:#666;margin-bottom:16px;font-size:13px;">Materias y grupos que tienes asignados este ciclo.</p>
      <table class="tabla">
        <thead><tr><th>Clave</th><th>Materia</th><th>Créditos</th><th>Grupo</th><th>Grado</th><th>Turno</th></tr></thead>
        <tbody id="tbody-materias"><tr><td colspan="6">Cargando...</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="tab-content" id="tab-horario">
    <div class="card">
      <h3>Mi horario semanal</h3>
      <div id="horario-contenido" style="margin-top:16px;"><p style="color:#666;font-size:13px;">Cargando horario...</p></div>
      <div style="margin-top:16px;">
        <button class="btn-secondary" onclick="window.print()">🖨️ Imprimir horario</button>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script>
const DIAS=['lunes','martes','miercoles','jueves','viernes'];
const DIAS_LABEL={lunes:'Lunes',martes:'Martes',miercoles:'Miércoles',jueves:'Jueves',viernes:'Viernes'};
const HORAS=['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
let sesion=null,_cacheHorario=null;

window.onload=async()=>{
  sesion=checkSesion();
  if(!sesion||sesion.rol!=='docente'){window.location.href='login.html';return;}
  renderNavbar('Portal Docente');
  await Promise.all([cargarMaterias(),prefetchHorario()]);
};

function mostrarTab(tab,e){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  e.target.classList.add('active');
  if(tab==='horario')renderHorario();
}

async function cargarMaterias(){
  const tbody=document.getElementById('tbody-materias');
  try{
    const mat=await apiGetMisMateriasDocente(sesion.id);
    tbody.innerHTML='';
    if(!mat.length){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:#999;">No tienes materias asignadas aún.</td></tr>';return;}
    mat.forEach(m=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${m.clave}</td><td>${m.nombre}</td><td>${m.creditos}</td>
        <td>${m.grupo}</td><td>${m.grado}°</td><td>${m.turno}</td>`;
      tbody.appendChild(tr);
    });
  }catch{tbody.innerHTML='<tr><td colspan="6">Error al cargar materias</td></tr>';}
}

async function prefetchHorario(){try{_cacheHorario=await apiGetHorarioDocente(sesion.id);}catch{}}

function renderHorario(){
  const c=document.getElementById('horario-contenido');
  const h=_cacheHorario;
  if(!h||!h.length||h.every(x=>!x.dia_semana)){
    c.innerHTML='<p style="color:#666;font-size:13px;">Tu horario aún no ha sido configurado. Pide al administrador que lo configure en Gestión de Grupos.</p>';return;
  }
  let html='<div class="horario-grid">';
  html+='<div class="h-header">Hora</div>';
  DIAS.forEach(d=>html+=`<div class="h-header">${DIAS_LABEL[d]}</div>`);
  HORAS.forEach(hora=>{
    html+=`<div class="h-hora">${hora}</div>`;
    DIAS.forEach(dia=>{
      const clases=h.filter(x=>x.dia_semana===dia&&x.hora_inicio?.slice(0,5)===hora);
      if(clases.length){
        html+='<div class="h-cell occ">';
        clases.forEach(cl=>{html+=`<div class="mn">${cl.materia}</div><div class="mi">Grupo: ${cl.grupo}</div><div class="mi">${cl.hora_inicio?.slice(0,5)} – ${cl.hora_fin?.slice(0,5)}</div>`;});
        html+='</div>';
      }else html+='<div class="h-cell"></div>';
    });
  });
  html+='</div>';c.innerHTML=html;
}
</script>
</body>
</html>
