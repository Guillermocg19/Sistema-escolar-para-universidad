<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Alumnos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>

<div class="navbar">
  <div class="navbar-left">
    <h2 id="navbar-titulo">Gestión de Alumnos</h2>
    <span id="navbar-rol" class="rol-badge"></span>
  </div>
  <div class="navbar-right">
    <span class="user-info" id="navbar-usuario"></span>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="container">
  <button class="btn-secondary" style="margin-bottom:20px;" onclick="history.back()">← Regresar</button>
  <div class="card">
    <h3 id="form-titulo">Nuevo Alumno</h3>
    <div class="form-grid">
      <input type="hidden"  id="edit-id">
      <input type="text"    id="f-nombre"     placeholder="Nombre(s)">
      <input type="text"    id="f-apellidos"  placeholder="Apellidos">
      <input type="email"   id="f-email"      placeholder="Correo electrónico">
      <input type="text"    id="f-telefono"   placeholder="Teléfono">
      <select id="f-grupo">
        <option value="">-- Seleccionar grupo --</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn-primary"   onclick="guardarAlumno()">Guardar</button>
      <button class="btn-secondary" onclick="limpiarForm()">Cancelar</button>
    </div>
    <p id="form-error" class="form-error"></p>
  </div>

  <div class="card">
    <h3>Alumnos registrados</h3>
    <table class="tabla">
      <thead>
        <tr>
          <th>Matrícula</th><th>Nombre</th><th>Apellidos</th>
          <th>Grupo</th><th>Email</th><th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-alumnos"></tbody>
    </table>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/gestion-alumnos.js"></script>
</body>
</html>
