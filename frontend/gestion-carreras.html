<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Carreras</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>

<div class="navbar">
  <div class="navbar-left">
    <h2 id="navbar-titulo">Gestión de Carreras</h2>
    <span id="navbar-rol" class="rol-badge"></span>
  </div>
  <div class="navbar-right">
    <span class="user-info" id="navbar-usuario"></span>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="container">
  <button class="btn-secondary" style="margin-bottom:20px;" onclick="history.back()">← Regresar</button>

  <div class="card">
    <h3 id="form-titulo">Nueva Carrera</h3>
    <div class="form-grid">
      <input type="hidden" id="edit-id">
      <input type="text"   id="f-clave"  placeholder="Clave (ej. ISC)">
      <input type="text"   id="f-nombre" placeholder="Nombre de la carrera">
    </div>
    <div class="form-actions">
      <button class="btn-primary"   onclick="guardarCarrera()">Guardar</button>
      <button class="btn-secondary" onclick="limpiarForm()">Cancelar</button>
    </div>
    <p id="form-error" class="form-error"></p>
  </div>

  <div class="card">
    <h3>Carreras registradas</h3>
    <table class="tabla">
      <thead>
        <tr><th>Clave</th><th>Nombre</th><th>Estado</th><th>Acciones</th></tr>
      </thead>
      <tbody id="tabla-carreras"></tbody>
    </table>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/gestion-carreras.js"></script>
</body>
</html>
