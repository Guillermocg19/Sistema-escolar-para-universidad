<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Inscripciones</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
</head>
<body>

<div class="navbar">
  <div class="navbar-left">
    <button onclick="history.back()" style="background:transparent;border:none;color:white;font-size:20px;cursor:pointer;padding:0 8px;">&#8592;</button>
    <h2 id="navbar-titulo">Inscripciones</h2>
    <span id="navbar-rol" class="rol-badge"></span>
  </div>
  <div class="navbar-right">
    <span class="user-info" id="navbar-usuario"></span>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="container">

  <!-- Tabs -->
  <div style="display:flex; gap:8px; margin-bottom:20px;">
    <button id="tab-individual" onclick="mostrarTab('individual')"
      style="padding:8px 20px; border-radius:8px; border:none; background:#1a73e8; color:white; font-weight:600; cursor:pointer;">
      Inscripción Individual
    </button>
    <button id="tab-grupo" onclick="mostrarTab('grupo')"
      style="padding:8px 20px; border-radius:8px; border:2px solid #1a73e8; background:white; color:#1a73e8; font-weight:600; cursor:pointer;">
      Por Grupo Completo
    </button>
  </div>

  <!-- Inscripción Individual -->
  <div id="panel-individual" class="card" style="margin-bottom:20px;">
    <h3>Inscribir Alumno</h3>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:12px; align-items:end;">
      <div>
        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">Alumno</label>
        <select id="sel-alumno" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
          <option value="">Seleccionar alumno...</option>
        </select>
      </div>
      <div>
        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">Grupo</label>
        <select id="sel-grupo-ind" onchange="cargarMateriasGrupoInd()" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
          <option value="">Seleccionar grupo...</option>
        </select>
      </div>
      <div>
        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">Materia-Grupo</label>
        <select id="sel-mg" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
          <option value="">Primero elige grupo...</option>
        </select>
      </div>
      <div>
        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">Periodo</label>
        <input id="inp-periodo-ind" value="2026-1" style="width:90px; padding:8px; border:1px solid #ddd; border-radius:6px;">
      </div>
    </div>
    <button onclick="inscribirAlumno()" style="margin-top:14px; padding:9px 24px; background:#1a73e8; color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer;">
      Inscribir
    </button>
    <span id="msg-ind" style="margin-left:12px; font-size:13px;"></span>
  </div>

  <!-- Inscripción Por Grupo -->
  <div id="panel-grupo" class="card" style="margin-bottom:20px; display:none;">
    <h3>Inscribir Grupo Completo</h3>
    <div style="display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end;">
      <div>
        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">Grupo</label>
        <select id="sel-grupo-masa" onchange="cargarMateriasGrupoMasa()" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px;">
          <option value="">Seleccionar grupo...</option>
        </select>
      </div>
      <div>
        <label style="font-size:13px; font-weight:600; display:block; margin-bottom:4px;">Periodo</label>
        <input id="inp-periodo-masa" value="2026-1" style="width:100px; padding:8px; border:1px solid #ddd; border-radius:6px;">
      </div>
    </div>
    <div id="lista-materias-masa" style="margin-top:14px;"></div>
    <button onclick="inscribirGrupo()" style="margin-top:14px; padding:9px 24px; background:#1a73e8; color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer;">
      Inscribir Todo el Grupo
    </button>
    <span id="msg-masa" style="margin-left:12px; font-size:13px;"></span>
  </div>

  <!-- Tabla de inscripciones -->
  <div class="card">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
      <h3 style="margin:0;">Inscripciones Registradas</h3>
      <input id="filtro-periodo" placeholder="Periodo (ej: 2026-1)" value="2026-1"
        style="padding:6px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px;">
      <button onclick="cargarInscripciones()"
        style="padding:6px 16px; background:#1a73e8; color:white; border:none; border-radius:6px; cursor:pointer; font-size:13px;">
        Filtrar
      </button>
    </div>
    <table class="tabla">
      <thead>
        <tr><th>Matrícula</th><th>Alumno</th><th>Materia</th><th>Grupo</th><th>Periodo</th><th>Estado</th><th>Acción</th></tr>
      </thead>
      <tbody id="tbody-inscripciones">
        <tr><td colspan="7">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/gestion-inscripciones.js"></script>
<script>
  const sesion = checkSesion();
  if (!sesion || sesion.rol !== 'admin') window.location.href = 'login.html';
  renderNavbar('Inscripciones', sesion?.rol);
  window.onload = init;
</script>
</body>
</html>
