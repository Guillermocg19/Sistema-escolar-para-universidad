<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Calificaciones</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/gestion.css">
  <style>
    .badge { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:bold; }
    .badge-aprobado  { background:#e8f5e9; color:#2e7d32; }
    .badge-reprobado { background:#fce4ec; color:#c62828; }
    .badge-inscrito  { background:#e3f2fd; color:#1565c0; }
    .badge-baja      { background:#f5f5f5; color:#757575; }
    .promedio-chip { display:inline-block; padding:3px 12px; border-radius:12px; font-size:13px; font-weight:bold; background:#f1f3f4; color:#333; }
    .promedio-chip.aprobado  { background:#e8f5e9; color:#2e7d32; }
    .promedio-chip.reprobado { background:#fce4ec; color:#c62828; }
    .cal-num   { font-size:14px; font-weight:600; }
    .cal-vacia { color:#bbb; }
    .periodo-selector { display:flex; gap:10px; align-items:center; margin-bottom:16px; }
    .periodo-selector input { padding:8px 12px; border:1px solid #ccc; border-radius:6px; font-size:14px; }
    .resumen-bar  { display:flex; gap:20px; margin-bottom:20px; flex-wrap:wrap; }
    .resumen-item { background:white; border-radius:8px; padding:14px 20px; box-shadow:0 2px 6px rgba(0,0,0,0.07); min-width:120px; text-align:center; }
    .resumen-item .num { font-size:26px; font-weight:bold; color:#1a73e8; }
    .resumen-item .lbl { font-size:12px; color:#888; margin-top:2px; }
    .resumen-item .num.verde { color:#2e7d32; }
    .resumen-item .num.rojo  { color:#c62828; }
  </style>
</head>
<body>

<div class="navbar">
  <div class="navbar-left">
    <h2 id="navbar-titulo">Mis Calificaciones</h2>
    <span id="navbar-rol" class="rol-badge"></span>
  </div>
  <div class="navbar-right">
    <span class="user-info" id="navbar-usuario"></span>
    <a href="cambiar-nip.html" style="color:white;font-size:13px;text-decoration:none;opacity:0.9;">🔑 Cambiar NIP</a>
    <a href="dashboard-alumno.html" style="color:white;font-size:13px;text-decoration:none;opacity:0.9;">← Mi portal</a>
    <button onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="container">
  <div class="periodo-selector">
    <label style="font-size:14px;color:#555;">Periodo:</label>
    <input type="text" id="sel-periodo" placeholder="ej: 2026-1" value="2026-1">
    <button class="btn-primary" onclick="cargarCalificaciones()">Consultar</button>
  </div>

  <div class="resumen-bar" id="resumen-bar" style="display:none;">
    <div class="resumen-item"><div class="num" id="res-total">—</div><div class="lbl">Materias Inscritas</div></div>
    <div class="resumen-item"><div class="num verde" id="res-aprobadas">—</div><div class="lbl">Aprobadas</div></div>
    <div class="resumen-item"><div class="num rojo" id="res-reprobadas">—</div><div class="lbl">Reprobadas</div></div>
    <div class="resumen-item"><div class="num" id="res-promedio">—</div><div class="lbl">Promedio General</div></div>
  </div>

  <div class="card">
    <h3 id="titulo-tabla">Calificaciones del Periodo</h3>
    <table class="tabla">
      <thead>
        <tr>
          <th>Materia</th><th>Grupo</th><th>Docente</th>
          <th>Parcial 1</th><th>Parcial 2</th><th>Parcial 3</th>
          <th>Promedio Final</th><th>Estado</th>
        </tr>
      </thead>
      <tbody id="tbody-calificaciones">
        <tr><td colspan="8">Selecciona un periodo y presiona Consultar.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script>
  let sesion = null;

  window.onload = async () => {
    sesion = checkSesion();
    if (!sesion || sesion.rol !== 'alumno') { window.location.href = 'login.html'; return; }
    renderNavbar('Mis Calificaciones');
    await cargarCalificaciones();
  };

  async function cargarCalificaciones() {
    const periodo = document.getElementById('sel-periodo').value.trim();
    const tbody   = document.getElementById('tbody-calificaciones');
    tbody.innerHTML = '<tr><td colspan="8">Cargando...</td></tr>';
    document.getElementById('resumen-bar').style.display = 'none';
    try {
      const token = localStorage.getItem('token');
      const q = periodo ? `?periodo=${encodeURIComponent(periodo)}` : '';
      const r = await fetch(
        `${API_URL}/calificaciones/usuario/${sesion.id}${q}`,
        { headers: { 'Authorization': 'Bearer ' + token } }
      );
      const datos = await r.json();
      if (!Array.isArray(datos) || datos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#999">
          No tienes calificaciones registradas para el periodo <strong>${periodo || 'seleccionado'}</strong>.
        </td></tr>`;
        return;
      }
      document.getElementById('titulo-tabla').textContent =
        `Calificaciones — Periodo ${datos[0].periodo}`;
      tbody.innerHTML = '';
      let sumPromedios = 0, countConPromedio = 0, aprobadas = 0, reprobadas = 0;
      datos.forEach(d => {
        const fmtCal = val => val !== null
          ? `<span class="cal-num">${parseFloat(val).toFixed(1)}</span>`
          : `<span class="cal-vacia">—</span>`;
        const numParciales = d.parciales_registrados || 0;
        const promClase = d.promedio_final !== null ? (d.promedio_final >= 60 ? 'aprobado' : 'reprobado') : '';
        const promTxt = d.promedio_final !== null
          ? `<span class="promedio-chip ${promClase}">${parseFloat(d.promedio_final).toFixed(2)}</span> <small style="color:#999">${numParciales}/3</small>`
          : `<span class="promedio-chip">— <small style="color:#999">${numParciales}/3</small></span>`;
        if (d.promedio_final !== null) {
          sumPromedios += parseFloat(d.promedio_final); countConPromedio++;
          if (d.estado === 'aprobado') aprobadas++;
          if (d.estado === 'reprobado') reprobadas++;
        }
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${d.clave}</strong> — ${d.materia}</td>
          <td>${d.grupo}</td>
          <td>${d.docente}</td>
          <td>${fmtCal(d.parcial1)}</td>
          <td>${fmtCal(d.parcial2)}</td>
          <td>${fmtCal(d.parcial3)}</td>
          <td>${promTxt}</td>
          <td><span class="badge badge-${d.estado}">${d.estado}</span></td>`;
        tbody.appendChild(tr);
      });
      document.getElementById('resumen-bar').style.display = 'flex';
      document.getElementById('res-total').textContent      = datos.length;
      document.getElementById('res-aprobadas').textContent  = aprobadas;
      document.getElementById('res-reprobadas').textContent = reprobadas;
      document.getElementById('res-promedio').textContent   = countConPromedio
        ? (sumPromedios / countConPromedio).toFixed(2) : '—';
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="8">Error al cargar calificaciones.</td></tr>';
      console.error(e);
    }
  }
</script>
</body>
</html>
