<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Aspirante — SII</title>
  <link rel="stylesheet" href="css/portales.css">
  <style>
    .reg-page { min-height:100vh; background:#EEF1F7; display:flex; flex-direction:column; align-items:center; padding:40px 20px 60px; }
    .reg-card { width:100%; max-width:560px; background:#fff; border-radius:20px; padding:32px; box-shadow:0 4px 28px rgba(13,43,94,.12); }
    .reg-header { display:flex; align-items:center; gap:14px; margin-bottom:28px; padding-bottom:20px; border-bottom:1px solid #EEF1F7; }
    .reg-icon { width:48px; height:48px; background:#1C2B4A; border-radius:14px; display:flex; align-items:center; justify-content:center; }
    .reg-icon svg { color:#fff; width:24px; height:24px; }
    .reg-header h2 { font-size:18px; font-weight:700; color:#1C2B4A; margin:0 0 3px; }
    .reg-header p  { font-size:12px; color:#7A90A8; margin:0; }
    .section-label { font-size:10px; font-weight:700; color:#7A90A8; text-transform:uppercase; letter-spacing:.1em; margin:20px 0 10px; }
    .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field-grid.full { grid-template-columns:1fr; }
    .sii-field { margin-bottom:0; }
    .sii-field label { display:block; font-size:10px; font-weight:700; color:#7A90A8; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
    .sii-field input, .sii-field select {
      width:100%; height:44px; padding:0 14px;
      border:1.5px solid #DDE6F2; border-radius:10px;
      font-size:13px; font-family:'DM Sans',sans-serif;
      background:#F5F8FD; color:#1C2B4A; outline:none; transition:border .18s;
    }
    .sii-field input:focus, .sii-field select:focus { border-color:#1558B0; background:#fff; }
    .sii-field input::placeholder { color:#B0BDD0; }
    .reg-submit { width:100%; height:48px; margin-top:24px; background:#1C2B4A; color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:700; font-family:'DM Sans',sans-serif; cursor:pointer; transition:background .15s; }
    .reg-submit:hover { background:#0D2358; }
    .reg-submit:disabled { background:#90a0b7; cursor:not-allowed; }
    #reg-error { margin-top:12px; color:#DC3545; font-size:12px; min-height:16px; text-align:center; }
    #reg-exito { margin-top:12px; color:#1A7A3F; font-size:13px; text-align:center; background:#E6F4EC; padding:12px; border-radius:8px; display:none; }
    .reg-back { font-size:12px; color:#7A90A8; text-decoration:none; display:inline-flex; align-items:center; gap:4px; margin-bottom:20px; transition:color .15s; }
    .reg-back:hover { color:#1C2B4A; }
    .req { color:#DC3545; }
    @media(max-width:520px){ .field-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body class="reg-page">

  <a href="login.html" class="reg-back">← Regresar al inicio de sesión</a>

  <div class="reg-card">
    <div class="reg-header">
      <div class="reg-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <div>
        <h2>Registro de Aspirante</h2>
        <p>Completa el formulario para iniciar tu proceso de admision</p>
      </div>
    </div>

    <div class="section-label">Datos personales <span class="req">*</span></div>
    <div class="field-grid">
      <div class="sii-field">
        <label>Nombre(s) <span class="req">*</span></label>
        <input type="text" id="r-nombre" placeholder="Tus nombres">
      </div>
      <div class="sii-field">
        <label>Apellido Paterno <span class="req">*</span></label>
        <input type="text" id="r-apellido-pat" placeholder="Apellido paterno">
      </div>
      <div class="sii-field">
        <label>Apellido Materno</label>
        <input type="text" id="r-apellido-mat" placeholder="Apellido materno">
      </div>
      <div class="sii-field">
        <label>CURP <span class="req">*</span></label>
        <input type="text" id="r-curp" placeholder="18 caracteres" maxlength="18" style="text-transform:uppercase;">
      </div>
    </div>

    <div class="section-label">Contacto <span class="req">*</span></div>
    <div class="field-grid">
      <div class="sii-field">
        <label>Correo electrónico <span class="req">*</span></label>
        <input type="email" id="r-correo" placeholder="tu@correo.com">
      </div>
      <div class="sii-field">
        <label>Teléfono</label>
        <input type="tel" id="r-telefono" placeholder="10 dígitos">
      </div>
    </div>

    <div class="section-label">Datos académicos</div>
    <div class="field-grid full">
      <div class="sii-field">
        <label>Carrera de interés <span class="req">*</span></label>
        <input type="text" id="r-carrera" placeholder="Ej. Ingeniería en Sistemas Computacionales">
      </div>
    </div>

    <div class="section-label">Acceso al sistema <span class="req">*</span></div>
    <div class="field-grid">
      <div class="sii-field">
        <label>Contraseña <span class="req">*</span></label>
        <input type="password" id="r-contrasena" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="sii-field">
        <label>Confirmar contraseña <span class="req">*</span></label>
        <input type="password" id="r-confirmar" placeholder="Repite tu contraseña">
      </div>
    </div>

    <button class="reg-submit" id="btn-registro" onclick="registrarAspirante()">
      Crear mi cuenta
    </button>
    <p id="reg-error"></p>
    <div id="reg-exito"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function registrarAspirante() {
      const nombre       = document.getElementById('r-nombre').value.trim();
      const apellido_pat = document.getElementById('r-apellido-pat').value.trim();
      const apellido_mat = document.getElementById('r-apellido-mat').value.trim();
      const curp         = document.getElementById('r-curp').value.trim().toUpperCase();
      const correo       = document.getElementById('r-correo').value.trim();
      const telefono     = document.getElementById('r-telefono').value.trim();
      const carrera_interes = document.getElementById('r-carrera').value.trim();
      const contrasena   = document.getElementById('r-contrasena').value;
      const confirmar    = document.getElementById('r-confirmar').value;
      const errorEl      = document.getElementById('reg-error');
      const exitoEl      = document.getElementById('reg-exito');
      errorEl.textContent = '';

      if (!nombre || !apellido_pat || !curp || !correo || !contrasena) {
        errorEl.textContent = 'Completa todos los campos obligatorios'; return;
      }
      if (curp.length !== 18) { errorEl.textContent = 'La CURP debe tener exactamente 18 caracteres'; return; }
      if (contrasena.length < 6) { errorEl.textContent = 'La contraseña debe tener al menos 6 caracteres'; return; }
      if (contrasena !== confirmar) { errorEl.textContent = 'Las contraseñas no coinciden'; return; }

      const btn = document.getElementById('btn-registro');
      btn.disabled = true; btn.textContent = 'Registrando...';

      try {
        const res = await apiRegistrarAspirante({
          nombre, apellido_pat, apellido_mat, curp, correo,
          telefono, carrera_interes, contrasena
        });

        if (res.message && !res.id) {
          errorEl.textContent = res.message;
          btn.disabled = false; btn.textContent = 'Crear mi cuenta';
          return;
        }

        exitoEl.style.display = 'block';
        exitoEl.innerHTML = `
          <strong>¡Registro exitoso!</strong><br>
          Tu usuario de acceso es: <strong>${res.usuario}</strong><br>
          Guarda este dato. En unos segundos serás redirigido al inicio de sesión.`;
        btn.style.display = 'none';

        setTimeout(() => { window.location.href = 'login.html?portal=aspirante'; }, 3500);

      } catch {
        errorEl.textContent = 'Error de conexión. Intenta de nuevo.';
        btn.disabled = false; btn.textContent = 'Crear mi cuenta';
      }
    }
  </script>
</body>
</html>
